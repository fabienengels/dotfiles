[main]
shell=fish
font=JetBrainsMono Nerd Font Mono:size=14:fontfeatures=cv02,cv04,cv06,cv07,cv11,cv12,cv16,cv17,cv18,zero
font-bold=JetBrainsMono Nerd Font Mono:size=14:fontfeatures=cv02,cv04,cv06,cv07,cv11,cv12,cv16,cv17,cv18,zero
font-italic=JetBrainsMono Nerd Font Mono:size=14:fontfeatures=cv02,cv04,cv06,cv07,cv11,cv12,cv16,cv17,cv18,zero
font-bold-italic=JetBrainsMono Nerd Font Mono:size=14:fontfeatures=cv02,cv04,cv06,cv07,cv11,cv12,cv16,cv17,cv18,zero
font-size-adjustment=0.5
#line-height=16
#vertical-letter-offset=0
pad=12x12 center
initial-color-theme=dark
include=~/.config/foot/themes/noctalia

[cursor]
style=block
blink=no
# Nearest equivalent to cursor-opacity=0.5 (hollow unfocused)
# unfocused-style=hollow

[mouse]
hide-when-typing=yes

[scrollback]
# Amount of lines scrolled per mouse wheel tick (default: 3.0).
multiplier=5.0
